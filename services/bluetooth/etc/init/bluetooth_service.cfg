{
    "jobs" : [{
            "name" : "post-fs-data",
            "cmds" : [
                "mkdir /data/log/bt",
                "chown bluetooth bluetooth /data/log/bt",
                "mkdir /data/service/el1/public/bluetooth 0711 bluetooth bluetooth",
                "mkdir /data/vendor/bluetooth 0770 blue_host blue_host",
                "chown bluetooth bluetooth /dev/tun",
                "chmod 0660 /dev/tun"
            ]
        }, {
            "name" : "bluetooth_service:service_start",
            "cmds" : [
                "stop a2dp_host"
            ]
        }
    ],
    "services" : [{
            "name" : "bluetooth_service",
            "path" : ["/system/bin/sa_main", "/system/profile/bluetooth_service.json"],
            "uid" : "bluetooth",
            "gid" : ["bluetooth", "shell", "wakelock", "uhid", "radio"],
            "ondemand" : true,
            "caps" : ["CAP_NET_ADMIN", "CAP_SYS_NICE", "CAP_WAKE_ALARM", "CAP_BLOCK_SUSPEND"],
            "secon" : "u:r:bluetooth_service:s0",
            "permission" : [
                "ohos.permission.MODIFY_AUDIO_SETTINGS",
                "ohos.permission.GET_NETWORK_INFO",
                "ohos.permission.PLACE_CALL",
                "ohos.permission.GET_TELEPHONY_STATE",
                "ohos.permission.ANSWER_CALL",
                "ohos.permission.READ_MESSAGES",
                "ohos.permission.SEND_MESSAGES",
                "ohos.permission.RECEIVE_SMS",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.DISTRIBUTED_DATASYNC",
                "ohos.permission.SET_TELEPHONY_STATE",
                "ohos.permission.GET_WIFI_INFO",
                "ohos.permission.GET_WIFI_INFO_INTERNAL",
                "ohos.permission.SET_WIFI_CONFIG",
                "ohos.permission.GET_WIFI_CONFIG",
                "ohos.permission.MANAGE_WIFI_HOTSPOT",
                "ohos.permission.PERMISSION_USED_STATS",
                "ohos.permission.MANAGE_SETTINGS",
                "ohos.permission.ACCESS_SYSTEM_SETTINGS",
                "ohos.permission.RECEIVE_UPDATE_MESSAGE",
                "ohos.permission.MANAGE_MEDIA_RESOURCES",
                "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
                "ohos.permission.MANAGE_SECURE_SETTINGS",
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.RUNNING_STATE_OBSERVER",
                "ohos.permission.GET_RUNNING_INFO",
                "ohos.permission.READ_CALL_LOG",
                "ohos.permission.READ_CONTACTS",
                "ohos.permission.ABILITY_BACKGROUND_COMMUNICATION",
                "ohos.permission.RECEIVER_STARTUP_COMPLETED",
                "ohos.permission.ACCESS_SERVICE_DM",
                "ohos.permission.REPORT_SECURITY_EVENT",
                "ohos.permission.MANAGE_AUDIO_CONFIG",
                "ohos.permission.MANAGE_BLUETOOTH",
                "ohos.permission.NETWORK_DHCP",
                "ohos.permission.CONNECTIVITY_INTERNAL",
                "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
                "ohos.permission.PERCEIVE_SMART_POWER_SCENARIO",
                "ohos.permission.CROSS_OS_INTERCONNECT"
            ],
            "jobs" : {
                "pre-start" : "bluetooth_service:service_start"
            }
        }
    ]
}
